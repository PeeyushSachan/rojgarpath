<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">RRB NTPC Accounts Clerk Cum Typist Selection Flow</title>
  <desc id="desc">Flow diagram showing CBT-1 to CBT-2 to CBTST to Document Verification to Medical Examination.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)" rx="20"/>
  <text x="600" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0b2b5b">Accounts Clerk Cum Typist Selection Flow</text>

  <g font-family="Arial, sans-serif" font-size="22" font-weight="700">
    <rect x="40" y="135" width="200" height="95" rx="14" fill="#0b2b5b"/>
    <text x="140" y="192" text-anchor="middle" fill="#ffffff">CBT-1</text>

    <rect x="280" y="135" width="200" height="95" rx="14" fill="#0b2b5b"/>
    <text x="380" y="192" text-anchor="middle" fill="#ffffff">CBT-2</text>

    <rect x="520" y="135" width="200" height="95" rx="14" fill="#e07b1f"/>
    <text x="620" y="192" text-anchor="middle" fill="#ffffff">CBTST</text>

    <rect x="760" y="135" width="200" height="95" rx="14" fill="#0b2b5b"/>
    <text x="860" y="192" text-anchor="middle" fill="#ffffff">DV</text>

    <rect x="1000" y="135" width="160" height="95" rx="14" fill="#0b2b5b"/>
    <text x="1080" y="192" text-anchor="middle" fill="#ffffff">Medical</text>
  </g>

  <g stroke="#334155" stroke-width="4" fill="none">
    <path d="M242 182 H278"/>
    <path d="M482 182 H518"/>
    <path d="M722 182 H758"/>
    <path d="M962 182 H998"/>
  </g>
  <g fill="#334155">
    <polygon points="278,175 292,182 278,189"/>
    <polygon points="518,175 532,182 518,189"/>
    <polygon points="758,175 772,182 758,189"/>
    <polygon points="998,175 1012,182 998,189"/>
  </g>

  <text x="620" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#334155">CBTST is qualifying in nature for Accounts Clerk Cum Typist.</text>
  <text x="620" y="309" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">Final shortlist proceeds after qualifying skill test + document and medical checks.</text>
</svg>
